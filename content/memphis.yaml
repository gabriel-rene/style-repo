summary: "Memphis, the group, was founded in Milan, 11 December 1980, by Ettore
  Sottsass, Barbara Radice, Marco Zanini, Aldo Cibic, Matteo Thun, Michele De
  Lucchi, and Martine Bedin. Others who did work in the Memphis idiom were:
  Peter Shire, Shiro Kuramata, and Michael Graves. Objects such as furniture and
  lighting designed in the Memphis style feature bright colors and bold
  geometric shapes, made from industrial materials such as plastic laminate. The
  group was formed in reaction to modernist design sensibilities, and advocated
  forms derived from popular culture and kitsch sources. The style associated
  with Memphis was influential and developed many international followers."
