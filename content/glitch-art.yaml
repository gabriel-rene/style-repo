guide:
  dek: Displacement, corruption and interrupted repetition make the image appear
    to malfunction.
  signature:
    - Channel offsets
    - Compression blocks
    - Broken scan lines
  application: Choose a specific kind of disruption and apply it consistently.
  caution: Keep animated distortion optional and honor reduced-motion preferences.
  compare:
    - acid-graphics
    - pixel-art
