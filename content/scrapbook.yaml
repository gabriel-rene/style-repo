names:
  primary: Scrapbook
  variants: []
summary: A scrapbook is a personal assemblage of found visual material, such as
  cutouts and glued-in artifacts, that records an individual life in a way
  comparable to a diary. Writing in Print magazine in 2016, Steven Heller draws
  on Jessica Helfand's 2008 study of American scrapbooks, which framed the form
  as an early open means of self-expression built on visual sampling, cultural
  mixing and the reuse of existing media. Meaning in a scrapbook often emerges
  from the juxtaposition of its pasted-in pieces.
