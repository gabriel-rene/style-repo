  dek: Photos, paper scraps, tape and handwritten notes are layered as if pasted
    into a personal album.
  signature:
    - Taped and torn edges
    - Paper textures
    - Handwritten notes
  application: Give each page one main image and let the pasted pieces support it.
  caution: Too many stickers and textures turn a personal layout into clutter.
