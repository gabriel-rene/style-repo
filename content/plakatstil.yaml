guide:
  dek: A reduced object and a commanding name make the advertising message
    immediately recognizable.
  signature:
    - Isolated object
    - Large brand lettering
    - Uncluttered background
  application: Choose the single object that best expresses the proposition.
  caution: Additional decorative elements can weaken the direct object-message
    relationship.
  compare:
    - art-deco
    - minimalism
