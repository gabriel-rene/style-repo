id: plakatstil
term_type: style
status: draft
names:
  primary: Plakatstil
  variants:
    - Sachplakat
    - Poster style
summary: Plakatstil reduced advertising posters to a forceful relationship
  between a product and its name. Instead of surrounding the object with an
  elaborate narrative, designers emphasized its silhouette, a limited palette
  and prominent lettering. Sachplakat describes the closely associated
  object-poster approach.
