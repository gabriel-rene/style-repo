  "summary": "Postmodern graphic design questioned the authority of a single
    neutral or universal visual language. Historical quotation, layered imagery
    and expressive typography could make the act of interpretation visible. It
    is a broad critical category; New Wave typography and grunge have separate
    entries to preserve their different formal characteristics.",
