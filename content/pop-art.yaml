guide:
  dek: Bold outlines, repetition and familiar commercial imagery give the image an
    immediate, graphic impact.
  signature:
    - Repeated motifs
    - Comic-like outlines
    - Enlarged print textures
  application: Let repetition or a familiar visual code carry the main idea.
  caution: Commercial-looking imagery alone does not explain the cultural context
    of a work.
  compare:
    - halftone
    - screen-printing
