guide:
  dek: Separate materials or image fragments retain their edges while forming a
    new composition.
  signature:
    - Visible seams
    - Mixed image scales
    - Contrasting material textures
  application: Create a clear anchor before introducing competing fragments.
  caution: A pile of unrelated assets needs a compositional reason to become a collage.
  compare:
    - photomontage
    - dada
