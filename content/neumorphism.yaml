id: neumorphism
term_type: aesthetic
status: published
names:
  primary: Neumorphism
  variants: []
summary: Neumorphism is a user interface trend that blends skeuomorphism with
  minimalism to produce soft, almost three-dimensional surfaces. Its name is a
  contraction of new skeuomorphism, and it is also called soft UI because of its
  low contrast. According to the Interaction Design Foundation, Michał Malewicz
  of Hype4 coined the term in 2019 after noticing such designs on Dribbble and
  Behance, with a viral banking app by Alexander Plyuto often cited as the first
  example. Typical traits include subtle light and dark shadows, muted semi-flat
  colors and rounded corners.
