guide:
  dek: Controls seem pressed out of, or into, one soft surface through paired
    light and dark shadows.
  signature:
    - Same-color surfaces
    - Paired soft shadows
    - Low-contrast relief
  application: Add labels, focus rings and state changes that do not rely on shadow alone.
  caution: Very low contrast often fails accessibility guidelines.
  compare:
    - skeuomorphism
    - claymorphism
    - flat-design
