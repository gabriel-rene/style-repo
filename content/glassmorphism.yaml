guide:
  dek: Translucent, blurred panels float above colorful backgrounds like sheets of
    frosted glass.
  signature:
    - Background blur
    - Semi-transparent panels
    - Thin light borders
  application: Test text contrast over the brightest and darkest parts of the background.
  caution: Blur alone is not a hierarchy; many stacked glass layers become muddy.
  compare:
    - frutiger-aero
    - flat-design
    - neumorphism
