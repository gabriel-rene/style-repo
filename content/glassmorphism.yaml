id: glassmorphism
term_type: aesthetic
status: published
names:
  primary: Glassmorphism
  variants: []
summary: Glassmorphism is a visual design style that imitates frosted glass,
  using varying degrees of translucency to separate foreground elements from the
  background and suggest depth. According to Nielsen Norman Group, it has been
  gaining popularity since 2020 and features prominently in the design systems
  of Apple and Microsoft. Its main ingredients are reduced opacity and
  background blur, often refined with strokes and gradients. Used carefully it
  can build hierarchy, but overuse can create accessibility and usability
  problems.
