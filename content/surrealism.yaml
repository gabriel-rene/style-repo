guide:
  dek: Unexpected relationships between familiar things make the image feel
    dreamlike, impossible or psychologically charged.
  signature:
    - Impossible juxtapositions
    - Uncanny scale
    - Ambiguous space
  application: Choose one coherent visual contradiction rather than many unrelated
    surprises.
  caution: An unusual image is not automatically a work of the historical movement.
  compare:
    - photomontage
    - collage
