guide:
  dek: Fine incised lines and layered hatching build tone through a dense, tactile
    drawing surface.
  signature:
    - Delicate linework
    - Crosshatching
    - Plate-like edges
  application: Reserve fine detail for reproduction sizes that can sustain it.
  caution: Do not confuse an etched visual effect with a verified printing process.
  compare:
    - woodcut
    - linocut
