names:
  primary: Mid-century modern
  variants: []
summary: Mid-century modern design, covering roughly the 1930s to the 1960s,
  balanced expression with efficiency and utility, recasting housewares,
  furniture and decorative arts as functional yet attractive products in which
  form followed function. Drawing on European modernists such as the Bauhaus,
  American industrial designers including Raymond Loewy and Walter Dorwin Teague
  produced sleek, sweeping, streamlined shapes in the 1930s. By the early 1950s
  a more refined American modern design had emerged, and mid-century designers
  worked with new materials such as plastic, aluminium and molded plywood,
  finished in natural tones and bold colours, with Charles and Ray Eames among
  the most prominent.
