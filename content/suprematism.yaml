guide:
  dek: Elementary geometric forms float in open space, with balance produced
    through position, angle and scale.
  signature:
    - Isolated geometry
    - Large empty fields
    - Weightless arrangements
  application: Use spacing and relative scale as the main expressive material.
  caution: Geometric similarity does not establish historical membership or influence.
  compare:
    - de-stijl
    - constructivism
