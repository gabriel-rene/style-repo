images:
  - file: assets/copperplate-script/Laguna_Copperplate_Inscription.gif
    source_url: https://commons.wikimedia.org/wiki/File:Laguna_Copperplate_Inscription.gif
    license: Public domain
    attribution: Nordenx, Public domain, via Wikimedia Commons
    rights_status: open
    caption: The Laguna Copperplate Inscription (circa 900AD) from the Laguna de Bay
      area in Luzon, the Philippines. The script used is based on the Indian
      Pallava used around the same period throughout India and Southeast Asia,
      showing heavy influence in the pre-colonial period of Philippine culture.
    depicts: null
  - file: assets/copperplate-script/Sample_of_Copperplate_Script_with_a_Offhand_Flourishing.jpg
