summary: Copperplate, also known as Round Hand, is a style of lettering refined
  by European penmen and engravers during the seventeenth and eighteenth
  centuries and written with a flexible nib. Pressing on the downstroke spreads
  the nib to make a thick line, while easing off on the upstroke leaves a fine
  hairline, and letters lean 45 to 55 degrees from the baseline. Early writers
  used swan and goose quills, and metal nibs arrived in the eighteenth century.
  In New South Wales schools, Round Hand was required from 1880 until cursive
  replaced it in 1925.
