    rights_status: open
    caption: A quote written in Copperplate script with offhand flourishing.
    depicts: null
  - file: assets/copperplate-script/Sample_of_Copperplate_Script_with_an_Oblique_Penholder.jpg
    source_url: https://commons.wikimedia.org/wiki/File:Sample_of_Copperplate_Script_with_an_Oblique_Penholder.jpg
    license: CC BY-SA 3.0
    attribution: Swchuck, CC BY-SA 3.0, via Wikimedia Commons
    rights_status: open
    caption: A sample of copperplate script with offhand flourishing. The pen-holder
