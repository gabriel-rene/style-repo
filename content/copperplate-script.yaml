guide:
  dek: Slender connecting strokes and swelling curves produce a flowing, highly
    controlled writing rhythm.
  signature:
    - Slanted letterforms
    - Fine hairlines
    - Looped connections
  application: Allow space for ascenders and flourishes; pair with a restrained text face.
  caution: Small reproduction can erase hairlines and close delicate counters.
  compare:
    - blackletter
