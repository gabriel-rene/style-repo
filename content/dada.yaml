guide:
  dek: Disjointed type, found material and abrupt changes in scale interrupt
    ordinary reading and visual expectation.
  signature:
    - Found typography
    - Cut-and-paste collisions
    - Unstable hierarchy
  application: Let an unexpected juxtaposition carry the concept.
  caution: Random arrangement alone cannot communicate a critical or playful intention.
  compare:
    - collage
    - photomontage
