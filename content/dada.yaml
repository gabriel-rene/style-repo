    - Dadaist
summary: Refers to the European artistic and literary movement of violent revolt
  against the pretentions of Western civilization, begun in Zurich in 1916 as a
  reaction to World War I. The movement advocated the use of irony, nihilism,
  iconoclasm, the absurd, and emphasized the importance of chance in the
  creation of poems, performances, and artworks, which were typically
  commonplace objects set in an artistic setting. The name Dada was chosen by
  chance from the dictionary.
