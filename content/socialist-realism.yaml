status: draft
names:
  primary: Socialist Realism
  variants: []
summary: Socialist Realism was an officially sanctioned Soviet artistic doctrine
  that shaped posters as well as painting and other media. Its visual
  communication often centered legible narratives, idealized figures and the
  celebration of labor or state goals. Retouched photography could be integrated
  into a convincing pictorial whole, so the transition from Constructivism was
  not simply a switch from photographs to painting. It is distinct from Social
  Realism, a broader term for art concerned with social conditions.
