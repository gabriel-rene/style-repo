guide:
  dek: Idealized figures, emphatic scale and clear narrative framing make a
    political or civic message immediately legible.
  signature:
    - Heroic scale and idealized figures
    - Clear narrative hierarchy
    - Unified, carefully retouched imagery
  application: Study how gaze, gesture and relative scale direct attention toward
    a central message. Identify the political context and intended audience of
    each example.
  caution: Do not confuse Socialist Realism with Social Realism, or label every
    Soviet poster alike. A visual resemblance alone does not establish doctrine
    or political intent.
  compare:
    - constructivism
    - wpa-poster-design
    - photomontage
