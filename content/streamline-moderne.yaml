guide:
  dek: Long horizontal movement and rounded, aerodynamic forms give objects and
    compositions a sense of flow.
  signature:
    - Rounded corners
    - Horizontal bands
    - Smooth volumetric shapes
  application: Use a continuous directional rhythm and a restrained set of curves.
  caution: Distinguish the aerodynamic emphasis from broader geometric Art Deco
    ornament.
  compare:
    - art-deco
    - airbrush
