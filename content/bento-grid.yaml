id: bento-grid
term_type: style
status: published
names:
  primary: Bento grid
  variants: []
summary: A bento grid is a user interface layout pattern modeled on the
  compartments of a traditional Japanese bento box, dividing content into
  distinct, clearly organized sections. A 2024 Muzli article describes it as a
  design trend that has become a fixture of UI and UX work, pairing a
  well-defined visual hierarchy with a minimalist, functional look. The article
  notes the approach is not entirely new, and its examples include work from
  companies such as Apple and GitHub.
