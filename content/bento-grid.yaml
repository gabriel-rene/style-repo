guide:
  dek: Content is split into rounded tiles of different sizes, packed into one
    tidy grid like a bento box.
  signature:
    - Modular tiles of varied size
    - Rounded corners
    - One idea per tile
  application: Size tiles by importance and keep a clear reading order on small screens.
  caution: Giving every tile equal weight removes the hierarchy the grid should create.
  compare:
    - swiss-international-style
    - minimalism
