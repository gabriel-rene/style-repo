guide:
  dek: Photographic fragments are combined to create an image that a single camera
    exposure would not produce.
  signature:
    - Cut photographic edges
    - Scale contradictions
    - Composite scenes
  application: Match or deliberately contradict lighting and perspective with clear intent.
  caution: Distinguish a constructed image from documentary evidence.
  compare:
    - collage
    - surrealism
