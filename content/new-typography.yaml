guide:
  dek: Asymmetry, directional relationships and clear typographic contrast
    organize the page around communication.
  signature:
    - Flush-left text
    - Sans-serif hierarchy
    - Active white space
  application: Build hierarchy from alignment, size and weight before adding decoration.
  caution: Do not mistake a single sans-serif face for an entire typographic system.
  compare:
    - bauhaus
    - swiss-international-style
