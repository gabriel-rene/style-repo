id: new-typography
term_type: movement
status: published
names:
  primary: New Typography
  variants: []
summary: The New Typography was a graphic design movement based in the Weimar
  Republic, defined in 1928 by the typographer Jan Tschichold in his book Die
  Neue Typographie. It rejected the traditional arrangement of type in favour of
  asymmetry, sans-serif letterforms and the active combination of photography
  and text, applied to posters, advertisements, business cards, stationery and
  brochures. Its participants included El Lissitzky, Kurt Schwitters, László
  Moholy-Nagy and Aleksandr Rodchenko, who held that graphic design could change
  society and convey the dynamism of modern life.
