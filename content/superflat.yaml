guide:
  dek: Flattened space and crisply bounded forms place characters, pattern and
    surface on a shared plane.
  signature:
    - Shallow pictorial space
    - Crisp contours
    - Dense surface pattern
  application: Explore flatness through figure-ground relationships, not just
    absent shadows.
  caution: The term describes a specific cultural framework as well as a visual effect.
  compare:
    - pop-art
    - ukiyo-e
