guide:
  dek: Light silhouettes against a deep blue field emphasize contact, exposure and
    the shape of an object.
  signature:
    - Blue-and-white contrast
    - Silhouetted forms
    - Soft contact edges
  application: Use a small number of strong silhouettes and leave the tonal field intact.
  caution: A blue filter on a photograph does not reproduce the contact-print process.
  compare:
    - photomontage
    - screen-printing
