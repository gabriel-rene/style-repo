guide:
  dek: A regular field of marks translates continuous tone into a printable pattern.
  signature:
    - Visible dot screens
    - Density-based tone
    - Graphic enlargement of detail
  application: Check the pattern at its final display size and resolution.
  caution: Rescaling can create moiré or destroy the intended dot structure.
  compare:
    - screen-printing
    - pop-art
