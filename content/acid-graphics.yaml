guide:
  dek: Distorted lettering, abrasive surfaces and synthetic imagery assembled into
    deliberately unstable compositions.
  signature:
    - Warped display type
    - Clashing scales
    - Dense, layered surfaces
  application: Keep practical event details in a clear, separate zone.
  caution: A fluorescent palette alone does not create the visual tension.
  compare:
