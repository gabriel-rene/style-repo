id: acid-graphics
term_type: aesthetic
status: draft
names:
  primary: Acid graphics
  variants: [] # TODO: harvest
summary: Acid graphics is a graphic design trend that revisits psychedelic
  visual language but treats it with irony and cynicism rather than utopian
  optimism. It is marked by bright colours, heavy use of neon green, warped or
  inverted experimental lettering, op-art patterning, sci-fi futurism and
  organic forms combined with a heavy metal feel. The style borrows from 1990s
  rave and acid house nightclub posters and from punk's do-it-yourself attitude.
  It appears mainly on music posters and record sleeves, and also in editorial,
  branding and digital design.
