guide:
  dek: Even outlines and clean color areas keep figures and environments equally
    readable.
  signature:
    - Consistent contour weight
    - Flat color
    - Precise environmental detail
  application: Use clear silhouettes and avoid unnecessary shading.
  caution: Simple outlines still require careful perspective and composition.
  compare:
    - flat-design
    - ukiyo-e
