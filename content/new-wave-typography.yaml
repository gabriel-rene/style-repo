  - title: New-Wave Typography | Tribute to Wolfgang Weingart
    url: https://www.behance.net/gallery/4451169/New-Wave-Typography-Tribute-to-Wolfgang-Weingart
    note: Irfan Ghani, 2012. Clearly attributed formal baseline for the style.
