guide:
  dek: A disciplined typographic foundation is stretched through layering, altered
    spacing and unconventional reading paths.
  signature:
    - Expanded letterspacing
    - Overlapping planes
    - Disrupted baselines
  application: Establish a readable base, then choose exactly where to interrupt it.
  caution: If everything is disrupted, the intended contrast disappears.
  compare:
    - postmodern-graphic-design
    - grunge-typography
works:
