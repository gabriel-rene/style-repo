names:
  primary: New Wave typography
  variants:
    - Swiss Punk
summary: New Wave typography experimented with the conventions of modernist
  typesetting through altered spacing, layering and unexpected relationships
  between text and image. April Greiman carried a Swiss training into a practice
  that embraced digital tools. Her 1986 Design Quarterly issue is a useful
  primary collection reference for this transition.
