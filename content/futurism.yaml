guide:
  dek: Explosive typography and competing directional forces turn text into a
    visual expression of motion.
  signature:
    - Mixed type scales
    - Diagonal movement
    - Words acting as images
  application: Use disrupted reading order for a deliberate expressive passage.
  caution: Preserve a clear route to essential information when adapting it to
    interfaces.
  compare:
    - dada
    - new-wave-typography
