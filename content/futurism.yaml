names:
  primary: Futurism
  variants: []
summary: Futurist graphic work explored speed, sound and mechanical energy
  through unconventional typography. Words and letters became pictorial
  material, interrupting ordinary syntax and reading order. Its formal
  experimentation must be understood alongside the movement’s militarism and the
  political commitments of individual practitioners.
