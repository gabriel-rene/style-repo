names:
  primary: De Stijl
  variants:
    - Stijl, De
summary: De Stijl connected geometric abstraction with a search for a wider
  order in art and daily life. Graphic work associated with the journal uses
  strong horizontal and vertical relationships, modular lettering and reduced
  color. Neoplasticism and Elementarism are related positions rather than exact
  interchangeable names for the entire movement.
