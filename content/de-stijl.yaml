guide:
  dek: Horizontal and vertical relationships organize flat geometric fields into
    an asymmetrical equilibrium.
  signature:
    - Orthogonal divisions
    - Primary-color relationships
    - Modular lettering
  application: Balance unequal areas rather than centering every element.
  caution: A fixed rectangular template misses the tension between positive and
    negative space.
  compare:
    - bauhaus
    - suprematism
