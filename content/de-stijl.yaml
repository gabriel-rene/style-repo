names:
  primary: De Stijl
  variants:
    - Stijl, De
summary: Refers to the Dutch artistic movement and periodical of the same name,
  founded by Theo Van Doesenburg in 1917 and lasting until the early 1930s.  The
  movement advocated the use of pure abstract form to express the universal in
  art.  De Stijl theories formed the basis for the art style known as
  Neo-Plasticism.
