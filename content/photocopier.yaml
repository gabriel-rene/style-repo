guide:
  dek: High-contrast reproduction, grain and repeated degradation create a rough
    documentary surface.
  signature:
    - Crushed shadows
    - Toner-like grain
    - Copied cut-and-paste edges
  application: Keep a clean master of essential type before introducing degradation.
  caution: Loss of detail should support the message rather than erase it.
  compare:
    - punk-graphics
    - grunge-typography
