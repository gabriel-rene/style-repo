id: maximalism
term_type: style
status: published
names:
  primary: Maximalism
  variants: []
summary: Maximalism in graphic design is an aesthetic of excess, framed as a
  reaction against minimalism. It relies on bold colours, patterns, textures,
  layering, repetition, intricate detail, serif type and ornament, leaves little
  or no white space, and freely mixes elements that would not sit together in a
  minimalist layout. The column traces its roots to advertising trade cards,
  which date from the 1700s and multiplied with colour lithography in the 1870s,
  and links it to horror vacui, the fear of empty space. It names Peter Max,
  David Carson and Stefan Sagmeister as contemporary maximalists.
