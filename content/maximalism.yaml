guide:
  dek: Abundant pattern, layered references and competing scales create a
    deliberately full visual field.
  signature:
    - High density
    - Layered ornament
    - Multiple visual rhythms
  application: Give the composition a dominant anchor so abundance remains navigable.
  caution: Maximum quantity without hierarchy becomes accidental clutter.
  compare:
    - memphis
    - psychedelic-art
