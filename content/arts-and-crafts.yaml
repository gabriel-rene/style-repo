names:
  primary: Arts and Crafts
  variants:
    - Arts and Crafts movement
summary: Arts and Crafts placed the quality of materials, making and the
  integrated page at the center of design. In book production, the movement
  encouraged close relationships between type, illustration, ornament and paper.
  Its critique of industrial manufacture should be distinguished from the many
  later designs that borrow its decorative vocabulary.
