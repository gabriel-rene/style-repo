guide:
  dek: Dense page texture, considered borders and integrated illustration give
    printed matter the character of a crafted object.
  signature:
    - Textured type blocks
    - Botanical ornament
    - Illustration and type in balance
  application: Treat the spread as one composition, including its margins and binding edge.
  caution: Do not substitute a distressed texture for attention to construction.
  compare:
    - art-nouveau
    - letterpress
