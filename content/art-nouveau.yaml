names:
  primary: Art Nouveau
  variants:
    - Jugendstil
    - Stile Liberty
summary: Art Nouveau brought sinuous natural forms into posters, lettering and
  decorative design. Its graphic work often integrates outlined figures,
  botanical motifs and lettering within one flowing surface. Regional practices
  differ considerably; the more geometric Vienna Secession has its own entry
  here.
