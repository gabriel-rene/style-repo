guide:
  dek: Organic lines connect lettering, figures and ornament into a continuous
    decorative surface.
  signature:
    - Whiplash curves
    - Contoured figures
    - Integrated botanical borders
  application: Let the illustration establish the rhythm, then fit the lettering
    deliberately.
  caution: Decoration should connect the elements rather than simply fill the margins.
  compare:
    - vienna-secession
    - arts-and-crafts
