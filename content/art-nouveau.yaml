id: art-nouveau
term_type: style
status: stub
names:
  primary: Art Nouveau
  variants: []
summary: Refers generally to the style of painting, architecture, decorative
  arts, and applied arts that flourished in Europe and the United States from
  about 1890 to 1910. The style is characterized by an emphasis on fluid,
  undulating, or serpentine lines or contours based on organic forms and the use
  of modern materials such as iron and glass. The style developed as regional
  variations under various names.
