id: claymorphism
term_type: aesthetic
status: published
names:
  primary: Claymorphism
  variants: []
summary: Claymorphism is a user interface design trend that gives elements a
  soft, inflated three-dimensional look. A 2022 Smashing Magazine article
  credits the term to Michal Malewicz, who had also been behind the earlier
  neumorphism trend. The effect is built from two inner shadows, one dark and
  one light, plus a usually darker outer shadow, which together make elements
  appear soft and floating. Unlike neumorphism, it can be used on any background
  color, easing that style's problems with visual hierarchy and contrast.
