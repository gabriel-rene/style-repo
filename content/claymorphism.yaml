guide:
  dek: Rounded, inflated shapes with soft inner and outer shadows make interface
    elements look like pressed clay.
  signature:
    - Puffy rounded forms
    - Pastel fills
    - Paired soft shadows
  application: Keep text on plain, high-contrast surfaces rather than on shaded forms.
  caution: Soft, low-contrast shadows can hide which elements are interactive.
  compare:
    - neumorphism
    - skeuomorphism
