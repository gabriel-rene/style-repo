guide:
  dek: Interlocking shapes and vibrating color relationships produce an immersive,
    visually unstable field.
  signature:
    - Swelling letterforms
    - Dense organic pattern
    - Optical color tension
  application: Design display lettering as part of the image, with practical
    details separate.
  caution: Illegibility can be expressive, but it should be a deliberate choice.
  compare:
    - art-nouveau
    - op-art
