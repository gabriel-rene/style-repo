names:
  primary: Psychedelic art
  variants:
    - Psychedelic design
summary: Psychedelic graphics used interlocking lettering, dense ornament and
  vibrating color to accompany countercultural communication. Posters often
  reward sustained looking rather than immediate reading. The research connects
  this visual vocabulary with renewed interest in Art Nouveau curves and
  decorative historical imagery.
