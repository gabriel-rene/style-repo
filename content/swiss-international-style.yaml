names:
  primary: Swiss International Style
  variants:
    - International Typographic Style
    - Swiss Style
summary: The International Typographic Style places typography, alignment and
  carefully structured space at the center of graphic communication. Its
  familiar vocabulary includes asymmetrical grids, sans-serif type and direct
  photography. Zurich and Basel approaches were not identical, and the entry
  treats Swiss design as a set of connected practices rather than a universal
  formula. # TODO
