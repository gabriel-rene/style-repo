guide:
  dek: A precise grid, asymmetrical balance and economical typography give complex
    information a clear visual order.
  signature:
    - Modular alignment
    - Flush-left sans-serif type
    - Restrained color and strong contrast
  application: Build a hierarchy with size, weight and space before introducing an accent.
  caution: Swiss design contains distinct approaches; avoid presenting one rigid
    recipe as universal.
  compare:
    - new-typography
    - new-wave-typography
