      note: Visual interpretation and practical design guidance; not a historical
        attribution.
guide:
  dek: Exposed structure, blunt typography and deliberately plain controls give
    the interface a direct, unvarnished character.
  signature:
    - Visible page structure
    - Hard edges
    - Unembellished links
  application: Keep navigation, focus states and reading order predictable.
  caution: Intentional roughness is no excuse for inaccessible controls or broken
    layouts.
  compare:
    - minimalism
    - postmodern-graphic-design
