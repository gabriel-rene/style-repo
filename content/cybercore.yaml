id: cybercore
term_type: aesthetic
status: published
names:
  primary: Cybercore
  variants: []
summary: Cybercore is an aesthetic, described by NYLON primarily as a fashion
  trend, that is strongly shaped by the early days of the internet and sits
  alongside the broader Y2K revival. It combines futuristic, science fiction
  influences with nostalgia, mixing techwear, cyberpunk and 2000s styles. Its
  visual references include the look of Photoshop and digital editing and old
  web material such as GIFs, video games and clip art, along with bright colors,
  rhinestones and metallics. The article notes wide circulation of the style on
  TikTok.
