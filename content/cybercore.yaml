guide:
  dek: Digital grids, neon light and computer imagery build a future imagined
    through technology.
  signature:
    - Neon on black
    - Circuit and grid motifs
    - Pixel and techno type
  application: Keep one readable text layer above the technical decoration.
  caution: Keep it distinct from cyberpunk, which adds urban decay and a dystopian
    story.
  compare:
    - cyberpunk-aesthetic
    - y2k-aesthetic
    - glitch-art
