guide:
  dek: Simplified figures and large flat shapes create friendly, approachable
    scenes with little surface detail.
  signature:
    - Exaggerated proportions
    - Flat color fields
    - Geometric environments
  application: Give gestures and relationships a specific meaning for the message.
  caution: Generic characters can make unrelated brands look interchangeable.
  compare:
    - flat-design
    - memphis
