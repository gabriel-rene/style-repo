guide:
  dek: Clear contour, patterned surfaces and cropped compositions create a strong
    relationship between figure and surrounding space.
  signature:
    - Flat color areas
    - Asymmetrical cropping
    - Patterned textiles and landscapes
  application: Study the organization of the whole print before borrowing a motif.
  caution: Treat prints as specific cultural works, not a generic decorative resource.
  compare:
    - woodcut
    - art-nouveau
