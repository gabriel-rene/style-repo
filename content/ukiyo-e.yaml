summary: Distinctive genre in painting and other media, but most prominently in
  woodblock printing. It arose in the Edo period (1600-1868) and built up a
  broad popular market among the middle classes. Subject matter typically
  focused on brothel districts and kabuki theatres, with formats ranging from
  single sheet prints to book illustrations. Generally, the style is
  characterized by a mixture of the realistic narrative of the Kamakura period
  and the mature decorative style of the Momoyama and Edo periods. Distinctive
  styles and specialties in subject matter were developed by different schools
  throughout the period.
