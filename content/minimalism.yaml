guide:
  dek: Reduction concentrates attention on a few elements, their proportions and
    the space between them.
  signature:
    - Limited visual vocabulary
    - Generous negative space
    - Precise alignment
  application: Remove competing signals while preserving context and usability.
  caution: Sparse content is not automatically a resolved composition.
  compare:
    - swiss-international-style
    - brutalist-web-design
