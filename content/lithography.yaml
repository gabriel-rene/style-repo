id: lithography
term_type: technique
status: stub
names:
  primary: Lithography
  variants:
    - lithographic
summary: Planographic printing process in which a design is deposited on a stone
  or plate with a greasy substance and the surface is chemically treated to
  accept ink only in the greasy areas.
