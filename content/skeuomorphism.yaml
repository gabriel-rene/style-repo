id: skeuomorphism
term_type: aesthetic
status: published
names:
  primary: Skeuomorphism
  variants: []
summary: Skeuomorphism is a design practice that brings real-world elements into
  digital interfaces so that new interfaces feel familiar; the term can mean
  either a functional learning aid or a visual trend of unnecessary real-world
  detail. The trend grew in the early 2000s and peaked in the early 2010s, with
  interfaces using realistic textures, shadows and gradients for a
  three-dimensional effect, such as wooden bookshelves in an e-reader or
  leather-bound notepads. Its excesses came to seem cluttered and dated, and
  flat design emerged in response.
