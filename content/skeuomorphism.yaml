guide:
  dek: Familiar materials and object-like controls help a digital surface suggest
    its physical function.
  signature:
    - Material cues
    - Beveled controls
    - Object-based metaphors
  application: Use physical cues only when they help explain an interaction.
  caution: Decorative realism can introduce misleading affordances.
  compare:
    - frutiger-aero
    - flat-design
