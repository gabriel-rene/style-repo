names:
  primary: Wabi-sabi
  variants: []
summary: Wabi-sabi is a concept in traditional Japanese aesthetics centered on
  accepting transience and imperfection, valuing beauty that is imperfect,
  impermanent and incomplete. It stems from the Buddhist teaching of the three
  marks of existence and was shaped in the tea ceremony by Murata Jukō, who
  favored simple rough utensils, and by Sen no Rikyū through his teahouse
  design. Its qualities include asymmetry, roughness, simplicity, economy,
  austerity and an appreciation of natural forms. Designer Leonard Koren's 1994
  book contrasted it with Western ideals of beauty and became a reference point
  for designers.
