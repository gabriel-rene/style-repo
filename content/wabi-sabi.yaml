guide:
  dek: Muted natural materials, asymmetry and visible wear express a quiet beauty
    in imperfection.
  signature:
    - Earthy muted palette
    - Natural textures
    - Asymmetry and restraint
  application: Let real texture and empty space carry the mood instead of added ornament.
  caution: It names a broader aesthetic philosophy, not only a muted color palette.
  compare:
    - minimalism
