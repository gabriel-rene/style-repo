guide:
  dek: Geometric form, asymmetrical organization and economical typography make
    communication feel constructed and purposeful.
  signature:
    - Primary geometric shapes
    - Strong scale contrast
    - Type and image as a system
  application: Choose a small vocabulary of shapes and make every placement serve hierarchy.
  caution: The school cannot be reduced to circles, triangles and primary colors.
  compare:
    - de-stijl
    - new-typography
