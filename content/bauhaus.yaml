summary: The Bauhaus was a school whose teaching joined art, craft and design
  through several changing programs. Its graphic work explored geometric
  typography, photography and asymmetrical organization. The institution’s three
  directors were Walter Gropius, Hannes Meyer and Ludwig Mies van der Rohe.
  Moholy-Nagy contributed as a teacher, not as a director of the German Bauhaus.
