summary: Refers to the German School of art, design, and architecture active in
  Weimar from 1919 to 1925, in Dessau from 1925 to 1932, and in Berlin from 1932
  to 1933. Training students in both fine art and craftsmanship, it produced
  objects and building designs intended for mass production using simple,
  geometric forms.
