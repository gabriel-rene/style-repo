guide:
  dek: Heavy typography, diagonals and geometric structures make a page feel
    active and forceful.
  signature:
    - Diagonal axes
    - Photographic fragments
    - Type used as structure
  application: Use one dominant directional axis to organize contrasting scales.
  caution: A red-and-black palette is not enough; structure carries the composition.
  compare:
    - suprematism
    - new-typography
