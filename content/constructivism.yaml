id: constructivism
term_type: movement
status: draft
names:
  primary: Constructivism
  variants: []
summary: Constructivist graphic communication connected experimental form with
  social and political purposes. Diagonal structures, bold typography and
  photographic montage recur in posters and publications. Constructivism,
  Productivism and agitprop overlap historically but describe different things;
  they are not stored as synonyms here.
