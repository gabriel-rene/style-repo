guide:
  dek: Thick black outlines, hard offset shadows and flat bright colors give an
    interface a bold, deliberately blunt look.
  signature:
    - Heavy black borders
    - Hard offset shadows
    - Flat saturated fills
  application: Use the heavy frame to single out a few key actions, not every element.
  caution: Keep this distinct from raw brutalist web design, which avoids a
    polished color system.
  compare:
    - brutalist-web-design
    - flat-design
