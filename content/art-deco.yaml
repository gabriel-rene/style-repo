summary: Art Deco graphic design brought geometric stylization, monumental scale
  and polished volume to commercial communication. Transport and product posters
  often treated lettering and imagery as parts of a single architectural
  composition. Pictorial modernism and Streamline Moderne are related contexts,
  not exact substitutes for the term.
