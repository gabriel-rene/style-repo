guide:
  dek: Geometric ornament and stylized volume give the page a monumental,
    carefully staged presence.
  signature:
    - Stepped silhouettes
    - Architectural lettering
    - Balanced geometric ornament
  application: Build the composition around one commanding shape and a compact palette.
  caution: Avoid treating every geometric composition as Art Deco.
  compare:
    - streamline-moderne
    - art-nouveau
