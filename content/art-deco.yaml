summary: Refers to the style predominently of architecture and the decorative
  arts, widely disseminated in Europe and the United States in the 1920s and
  1930s, which became popular after the Exposition Internationale des Arts
  Décoratifs et Modernes in Paris in 1925. The style is characterized by a
  synthesis of industrial and fine arts materials used to create a wide variety
  of both man-made and mass-produced objects, often with an emphasis on
  rectilinear motifs, vibrant colors, and elegant, abstracted, simplified forms.
