guide:
  dek: Cut marks and broad printed shapes make a composition feel direct and
    tactile.
  signature:
    - Bold silhouettes
    - Gouged line rhythms
    - Contrasting positive and negative areas
  application: Plan the areas that remain and those removed as equally active shapes.
  caution: A distressed filter lacks the directional logic of a carved mark.
  compare:
    - woodcut
    - screen-printing
