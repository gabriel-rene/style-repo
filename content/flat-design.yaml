guide:
  dek: Simple silhouettes and clear color separation reduce the appearance of
    physical depth.
  signature:
    - Solid fills
    - Minimal shading
    - Simple icon geometry
  application: Use spacing, labels and contrast to make interactive elements identifiable.
  caution: Removing depth must not remove affordances.
  compare:
    - corporate-memphis
    - minimalism
