names:
  primary: Y2K aesthetic
  variants: []
summary: The Y2K aesthetic is a design style tied to the turn of the millennium,
  spanning the late 1990s and early 2000s. It is known for rounded, inflated
  typefaces and a hyper-digital finish of metallic, glossy, mirrored and 3D
  surfaces, along with interface cues such as loading bars and rendered buttons.
  Holographic gradients, iridescent colours and shiny silver are among its most
  recognisable traits, reflecting enthusiasm for new technology at the time.
