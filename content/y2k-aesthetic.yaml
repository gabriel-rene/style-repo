guide:
  dek: Glossy surfaces, synthetic forms and compact digital typography evoke an
    imagined technological future.
  signature:
    - Metallic effects
    - Translucent plastics
    - Rounded digital forms
  application: Choose between glossy futurism and utilitarian interface references
    before combining them.
  caution: The label covers multiple visual tendencies rather than one consistent
    system.
  compare:
    - frutiger-aero
    - cyberpunk-aesthetic
